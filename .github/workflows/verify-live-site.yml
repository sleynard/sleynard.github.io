name: Verify live site deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-site.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public homepage shell
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 https://stephenleynard.com/ -o /tmp/home.html
          grep -F "const POST_VIEW_SESSION_KEY = 'mindovermatter_viewed_posts';" /tmp/home.html
          grep -F "location.pathname === '/admin'" /tmp/home.html
          if grep -Fq 'id="readerDangerZone"' /tmp/home.html; then
            echo 'Private account DOM should be stripped from the public homepage.' >&2
            exit 1
          fi
      - name: Verify private routed shells
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 https://stephenleynard.com/account -o /tmp/account.html
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 https://stephenleynard.com/admin -o /tmp/admin.html
          grep -F 'id="readerDangerZone"' /tmp/account.html
          grep -F 'Delete my account' /tmp/account.html
          grep -F '<th>Views</th>' /tmp/admin.html
          grep -F 'class="publish-state' /tmp/admin.html
          grep -F 'Admin access' /tmp/admin.html
      - name: Verify legal pages
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 https://stephenleynard.com/privacy -o /tmp/privacy.html
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 https://stephenleynard.com/terms -o /tmp/terms.html
          grep -F 'simple per-article view count' /tmp/privacy.html
          grep -F 'Signed-in readers can permanently delete their own reader account directly' /tmp/privacy.html
          grep -F 'Signed-in readers may permanently delete their own reader account through My Reader Account' /tmp/terms.html
      - name: Verify article route
        run: |
          set -euo pipefail
          post_code=$(curl --silent --show-error --location -o /tmp/post.html -w '%{http_code}' https://stephenleynard.com/blog/test)
          test "$post_code" = "200"
          grep -F 'Test' /tmp/post.html
          echo "Live verification passed for public, private, legal, and article routes."
