name: Run final site polish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-final-site-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-final-site-polish.py
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html functions/privacy.js functions/terms.js
          git rm scripts/apply-final-site-polish.py .github/workflows/run-final-site-polish.yml .github/workflows/home-polish-once.yml
          git diff --cached --check
          git commit -m "Finish site polish, analytics, and reader controls"
          git push
