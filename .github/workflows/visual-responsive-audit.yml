name: Visual responsive audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-responsive-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive audit and screenshots
        run: |
          mkdir -p audit-shots
          cat > /tmp/audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const viewports = [
            {name:'desktop-1440', width:1440, height:1000},
            {name:'desktop-1180', width:1180, height:900},
            {name:'tablet-1024', width:1024, height:1000},
            {name:'tablet-768', width:768, height:1024},
            {name:'mobile-390', width:390, height:844},
            {name:'mobile-360', width:360, height:800},
          ];
          const pages = [
            ['home','https://stephenleynard.com/'],
            ['blog','https://stephenleynard.com/blog'],
            ['books','https://stephenleynard.com/books'],
            ['about','https://stephenleynard.com/about'],
            ['resources','https://stephenleynard.com/resources'],
          ];
          const failures = [];
          const report = [];
          const browser = await chromium.launch({headless:true});

          function addFailure(v,p,msg){ failures.push(`${v} / ${p}: ${msg}`); }

          for(const viewport of viewports){
            const context = await browser.newContext({viewport:{width:viewport.width,height:viewport.height}, colorScheme:'dark'});
            const page = await context.newPage();
            for(const [pageName,url] of pages){
              await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(250);
              const metrics = await page.evaluate(() => {
                const vw = window.innerWidth;
                const body = document.body;
                const html = document.documentElement;
                const visibleRects = [...document.querySelectorAll('main,section,.page.visible,.blog-wrap,.directory-wrap,.about-wrap,.resource-grid,.book-grid,.post-list,.site-footer')]
                  .filter(el => {
                    const s=getComputedStyle(el); const r=el.getBoundingClientRect();
                    return s.display!=='none' && s.visibility!=='hidden' && r.width>0 && r.height>0;
                  })
                  .map(el => ({tag:el.tagName,cls:el.className,width:el.getBoundingClientRect().width,left:el.getBoundingClientRect().left,right:el.getBoundingClientRect().right}));
                return {
                  innerWidth:vw,
                  scrollWidth:Math.max(body.scrollWidth,html.scrollWidth),
                  bodyFont:parseFloat(getComputedStyle(body).fontSize),
                  badRects:visibleRects.filter(r => r.left < -2 || r.right > vw+2),
                };
              });
              if(metrics.scrollWidth > metrics.innerWidth + 2) addFailure(viewport.name,pageName,`horizontal overflow ${metrics.scrollWidth}px > ${metrics.innerWidth}px`);
              if(metrics.badRects.length) addFailure(viewport.name,pageName,`visible container outside viewport: ${JSON.stringify(metrics.badRects.slice(0,3))}`);
              if(metrics.bodyFont < 15) addFailure(viewport.name,pageName,`body font ${metrics.bodyFont}px is too small`);
              report.push({viewport:viewport.name,page:pageName,...metrics});
              await page.screenshot({path:`audit-shots/${viewport.name}-${pageName}.png`,fullPage:true});
            }

            await page.goto('https://stephenleynard.com/account',{waitUntil:'networkidle',timeout:60000});
            await page.evaluate(() => setReaderAuthMode('signup'));
            await page.waitForTimeout(100);
            const signup = await page.evaluate(() => {
              const box=document.querySelector('.signup-consent');
              const legal=document.querySelector('.signup-legal-note');
              const consent=document.querySelector('.consent-label');
              const submit=document.querySelector('#readerAuthSubmit');
              const form=document.querySelector('#view-account form');
              const boxR=box.getBoundingClientRect(), legalS=getComputedStyle(legal), consentS=getComputedStyle(consent), submitR=submit.getBoundingClientRect(), formR=form.getBoundingClientRect();
              return {
                visible:getComputedStyle(box).display!=='none',
                boxLeft:boxR.left,boxRight:boxR.right,boxWidth:boxR.width,
                formLeft:formR.left,formRight:formR.right,
                gapAfterConsent:submitR.top-boxR.bottom,
                legalRatio:parseFloat(legalS.lineHeight)/parseFloat(legalS.fontSize),
                consentRatio:parseFloat(consentS.lineHeight)/parseFloat(consentS.fontSize),
                legalPaddingTop:parseFloat(legalS.paddingTop),
              };
            });
            if(!signup.visible) addFailure(viewport.name,'account-signup','consent block hidden');
            if(signup.boxLeft < -2 || signup.boxRight > viewport.width+2) addFailure(viewport.name,'account-signup','consent block outside viewport');
            if(signup.legalRatio < 1.6) addFailure(viewport.name,'account-signup',`legal line-height ratio ${signup.legalRatio.toFixed(2)} is tight`);
            if(signup.consentRatio < 1.6) addFailure(viewport.name,'account-signup',`consent line-height ratio ${signup.consentRatio.toFixed(2)} is tight`);
            if(signup.legalPaddingTop < 12) addFailure(viewport.name,'account-signup','legal note separation is too small');
            report.push({viewport:viewport.name,page:'account-signup',...signup});
            await page.screenshot({path:`audit-shots/${viewport.name}-account-signup.png`,fullPage:true});

            await page.goto('https://stephenleynard.com/blog',{waitUntil:'networkidle',timeout:60000});
            const gradient = await page.evaluate(() => ({
              feature:getComputedStyle(document.querySelector('.featured-post')).backgroundImage,
              page:getComputedStyle(document.querySelector('#view-blog-list')).backgroundImage,
            }));
            if(gradient.feature !== 'none') addFailure(viewport.name,'blog',`featured essay localized gradient remains: ${gradient.feature}`);
            if(!gradient.page.includes('linear-gradient')) addFailure(viewport.name,'blog','page ambient gradient missing');

            await page.goto('https://stephenleynard.com/books',{waitUntil:'networkidle',timeout:60000});
            const bookGradient = await page.evaluate(() => getComputedStyle(document.querySelector('#view-books')).backgroundImage);
            if(!bookGradient.includes('linear-gradient')) addFailure(viewport.name,'books','page ambient gradient missing');

            await context.close();
          }
          await browser.close();
          fs.writeFileSync('audit-shots/report.json',JSON.stringify({failures,report},null,2));
          if(failures.length){ console.error(failures.join('\n')); process.exit(1); }
          console.log('Responsive audit passed all automated layout checks.');
          JS
          node /tmp/audit.mjs

      - name: Upload audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-screenshots
          path: audit-shots
          retention-days: 1
