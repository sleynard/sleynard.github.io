name: Run one-time index cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-index-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validated cleanup
        run: python .github/scripts/cleanup_index.py

      - name: Verify diff
        run: |
          git diff --check
          git diff -- index.html

      - name: Commit cleaned index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean legal navigation and privacy disclosures"
          git push
